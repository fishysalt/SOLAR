# engineer Agent 配置

name: engineer
display_name: "✨ engineer"
description: "工具自生成，给其他agent提供新的能力"

# 能力列表
capabilities:
  - name: tool_generation
    description: "根据需求生成工具"
    input: "文本描述"
    output: "工具脚本"


# 模型配置
model:
  provider: deepseek
  name: deepseek-v4-pro
  temperature: 0.7

# 通信配置
communication:
  timeout: 120

# 记忆配置
memory:
  short_term_window: 30
  long_term_enabled: true